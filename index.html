<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word pair card maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE9DD;
    --ink:#20241F;
    --ink-soft:#5C6058;
    --reveal-bg:#20241F;
    --reveal-text:#EDE9DD;
    --line:#20241F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Space Mono',monospace;
    background:#F6F4EE;
    color:var(--ink);
    padding:32px 16px 64px;
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    display:grid;
    grid-template-columns:340px 1fr;
    gap:40px;
  }
  @media (max-width:800px){ .wrap{grid-template-columns:1fr;} }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0 0 4px; }
  .sub{ font-size:12px; color:var(--ink-soft); margin:0 0 28px; letter-spacing:.02em; }
  label{ display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin:18px 0 6px; }
  input,textarea{
    width:100%; font-family:'Space Mono',monospace; font-size:14px; padding:9px 10px;
    background:#fff; border:1px solid #cfcabb; border-radius:2px; color:var(--ink); resize:vertical;
  }
  input:focus,textarea:focus{ outline:none; border-color:var(--ink); }
  .row{display:flex;gap:10px;}
  .row > div{flex:1;}
  input[type="range"]{
    -webkit-appearance:none; appearance:none; height:2px; background:#cfcabb; padding:0; border:none; margin-top:4px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--ink); cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; background:var(--ink); border:none; cursor:pointer;
  }
  button{
    margin-top:14px; width:auto; padding:10px 20px; font-family:'Space Mono',monospace; font-size:12px;
    letter-spacing:.1em; text-transform:uppercase; background:var(--ink); color:var(--paper);
    border:none; border-radius:2px; cursor:pointer;
  }
  button:hover{opacity:.88;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .hint{ font-size:11px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }

  .format-example{
    background:#fff; border:1px solid #cfcabb; border-radius:2px; padding:12px 14px;
    font-family:'Space Mono',monospace; font-size:12px; line-height:1.6; color:var(--ink-soft);
    margin:14px 0; white-space:pre-wrap;
  }
  #bulk-input{
    width:100%; min-height:220px; font-family:'Space Mono',monospace; font-size:13px; line-height:1.6;
    padding:12px; background:#fff; border:1px solid #cfcabb; border-radius:2px; color:var(--ink);
  }

  /* card */
  .stage{ display:flex; align-items:flex-start; justify-content:center; }
  #card{
    width:520px; height:520px; background:var(--paper); border:1px solid var(--line);
    position:relative; display:grid; grid-template-rows: var(--split-top, 1fr) 1px var(--split-bottom, 1fr);
  }
  .half{ min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; position:relative; }
  .divider{ height:1px; background:var(--line); position:relative; }
  .divider::before{
    content:""; position:absolute; left:50%; top:-3.5px; transform:translateX(-50%) rotate(45deg);
    width:7px; height:7px; background:var(--paper); border:1px solid var(--line);
  }
  .eyebrow{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:14px; }
  .word{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:64px; line-height:1; word-break:break-word; }
  .bottom-half{ background:var(--reveal-bg); color:var(--reveal-text); }
  .bottom-half .eyebrow{ color:#B8B29E; }
  .meaning{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:52px; line-height:1.1; max-width:440px; word-break:break-word; }

  .bulk-wrap{ max-width:1040px; margin:56px auto 0; border-top:1px solid #dcd7c8; padding-top:32px; }
  .bulk-wrap h2{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin:0 0 4px; }
  #bulk-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:20px; margin-top:28px; }
  .thumb-wrap{ width:100%; aspect-ratio:1/1; overflow:hidden; position:relative; border:1px solid var(--line); background:var(--paper); }
  .mini-inner{
    width:520px; height:520px; transform-origin:top left; display:grid;
    grid-template-rows: var(--split-top, 1fr) 1px var(--split-bottom, 1fr); background:var(--paper);
  }
  .mini-inner .half{ min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; position:relative; }
  .mini-inner .divider{ height:1px; background:var(--line); position:relative; }
  .mini-inner .divider::before{
    content:""; position:absolute; left:50%; top:-3.5px; transform:translateX(-50%) rotate(45deg);
    width:7px; height:7px; background:var(--paper); border:1px solid var(--line);
  }
  .mini-inner .eyebrow{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:14px; }
  .mini-inner .word{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:64px; line-height:1; word-break:break-word; }
  .mini-inner .bottom-half{ background:var(--reveal-bg); color:var(--reveal-text); }
  .mini-inner .bottom-half .eyebrow{ color:#B8B29E; }
  .mini-inner .meaning{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:52px; line-height:1.1; max-width:440px; word-break:break-word; }
  .thumb-label{ font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Word pair card maker</h1>
    <p class="sub">"[Label] / Word / Meaning" reveal card generator</p>

    <label for="label-top">Top label (applies to all cards)</label>
    <input id="label-top" value="Opposite of">

    <label for="label-bottom">Bottom label (optional)</label>
    <input id="label-bottom" value="">

    <label for="split">Divider position — <span id="split-val">50</span>% down</label>
    <input id="split" type="range" min="20" max="80" value="50" step="1">

    <label for="word-size">Word size — <span id="word-size-val">64</span>px <span style="text-transform:none;letter-spacing:0;">(0 = auto-fit)</span></label>
    <input id="word-size" type="range" min="0" max="140" value="0" step="2">

    <label for="bulk-input">Word / meaning pairs</label>
    <p class="format-example">Up
Down

Left
Right

Hot
Cold</p>
    <textarea id="bulk-input" placeholder="word&#10;meaning&#10;&#10;word&#10;meaning">Up
Down</textarea>

    <button id="bulk-generate">Generate cards</button>
    <button id="bulk-download" disabled>Download all (zip)</button>
    <p class="hint">Each pair is two lines: the word, then its match, separated by a blank line. First pair also previews live on the right.</p>
  </div>

  <div class="stage">
    <div id="card">
      <div class="half">
        <div class="eyebrow" id="p-label-top">Opposite of</div>
        <div class="word" id="p-word">Up</div>
      </div>
      <div class="divider"></div>
      <div class="half bottom-half">
        <div class="eyebrow" id="p-label-bottom" style="display:none;"></div>
        <div class="meaning" id="p-meaning">Down</div>
      </div>
    </div>
  </div>
</div>

<div class="bulk-wrap">
  <h2>Generated cards</h2>
  <div id="bulk-grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  const labelTopIn = document.getElementById('label-top');
  const labelBottomIn = document.getElementById('label-bottom');
  const splitIn = document.getElementById('split');
  const splitVal = document.getElementById('split-val');
  const cardEl = document.getElementById('card');
  const bulkInput = document.getElementById('bulk-input');
  const wordSizeIn = document.getElementById('word-size');
  const wordSizeVal = document.getElementById('word-size-val');

  const pLabelTop = document.getElementById('p-label-top');
  const pLabelBottom = document.getElementById('p-label-bottom');
  const pWord = document.getElementById('p-word');
  const pMeaning = document.getElementById('p-meaning');

  function syncSplit(){
    const v = parseInt(splitIn.value, 10);
    splitVal.textContent = v;
    cardEl.style.setProperty('--split-top', v + 'fr');
    cardEl.style.setProperty('--split-bottom', (100 - v) + 'fr');
  }
  splitIn.addEventListener('input', () => { syncSplit(); regenerate(); });
  syncSplit();

  wordSizeIn.addEventListener('input', () => {
    wordSizeVal.textContent = wordSizeIn.value === '0' ? 'auto' : wordSizeIn.value;
    syncPreview();
    regenerate();
  });
  wordSizeVal.textContent = 'auto';

  function fitSize(el, text, base, mid, small){
    const len = (text || '').length;
    let size = base;
    if(len > 8) size = mid;
    if(len > 14) size = small;
    el.style.fontSize = size + 'px';
  }

  // Applies the manual word-size override when set, else falls back to auto-fit.
  function setWordSize(el, text){
    const manual = parseInt(wordSizeIn.value, 10);
    if(manual > 0){
      el.style.fontSize = manual + 'px';
    } else {
      fitSize(el, text, 64, 48, 36);
    }
  }

  function parsePairs(text){
    const lines = text.split('\n').map(l => l.trim());
    const blocks = [];
    let current = [];
    lines.forEach(line => {
      if(line === ''){
        if(current.length) blocks.push(current);
        current = [];
      } else {
        current.push(line);
      }
    });
    if(current.length) blocks.push(current);

    return blocks
      .map(b => ({ word: b[0] || '', meaning: b[1] || '' }))
      .filter(e => e.word && e.meaning);
  }

  function syncPreview(){
    pLabelTop.textContent = labelTopIn.value || '';
    if(labelBottomIn.value){
      pLabelBottom.textContent = labelBottomIn.value;
      pLabelBottom.style.display = 'block';
    } else {
      pLabelBottom.style.display = 'none';
    }
    const pairs = parsePairs(bulkInput.value);
    const first = pairs[0] || { word: '', meaning: '' };
    pWord.textContent = first.word || 'word';
    pMeaning.textContent = first.meaning || 'meaning';
    setWordSize(pWord, first.word);
    fitSize(pMeaning, first.meaning, 52, 40, 30);
  }
  [labelTopIn, labelBottomIn, bulkInput].forEach(el => el.addEventListener('input', syncPreview));
  syncPreview();

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function buildMiniCard(entry){
    const wrap = document.createElement('div');
    const thumb = document.createElement('div');
    thumb.className = 'thumb-wrap';

    const inner = document.createElement('div');
    inner.className = 'mini-inner';
    const scale = 240 / 520;
    inner.style.transform = 'scale(' + scale + ')';
    inner.style.setProperty('--split-top', splitIn.value + 'fr');
    inner.style.setProperty('--split-bottom', (100 - splitIn.value) + 'fr');

    inner.innerHTML =
      '<div class="half">' +
        '<div class="eyebrow">' + escapeHtml(labelTopIn.value || '') + '</div>' +
        '<div class="word">' + escapeHtml(entry.word) + '</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="half bottom-half">' +
        (labelBottomIn.value ? '<div class="eyebrow">' + escapeHtml(labelBottomIn.value) + '</div>' : '') +
        '<div class="meaning">' + escapeHtml(entry.meaning) + '</div>' +
      '</div>';

    setWordSize(inner.querySelector('.word'), entry.word);
    fitSize(inner.querySelector('.meaning'), entry.meaning, 52, 40, 30);

    thumb.appendChild(inner);
    wrap.appendChild(thumb);

    const label = document.createElement('div');
    label.className = 'thumb-label';
    label.textContent = entry.word + ' → ' + entry.meaning;
    wrap.appendChild(label);

    wrap._captureNode = inner;
    wrap._entry = entry;
    return wrap;
  }

  let generatedCards = [];

  function regenerate(){
    const entries = parsePairs(bulkInput.value);
    const grid = document.getElementById('bulk-grid');
    grid.innerHTML = '';
    generatedCards = [];
    entries.forEach(entry => {
      const card = buildMiniCard(entry);
      grid.appendChild(card);
      generatedCards.push(card);
    });
    document.getElementById('bulk-download').disabled = generatedCards.length === 0;
  }

  document.getElementById('bulk-generate').addEventListener('click', regenerate);

  document.getElementById('bulk-download').addEventListener('click', async () => {
    if(!generatedCards.length) return;
    const btn = document.getElementById('bulk-download');
    const originalText = btn.textContent;
    btn.textContent = 'Zipping...';
    btn.disabled = true;

    const zip = new JSZip();
    for(const wrap of generatedCards){
      const node = wrap._captureNode;
      const originalTransform = node.style.transform;
      node.style.transform = 'scale(1)';
      const canvas = await html2canvas(node, { scale: 2, backgroundColor: null, width: 520, height: 520 });
      node.style.transform = originalTransform;
      const dataUrl = canvas.toDataURL('image/png').split(',')[1];
      const safeName = (wrap._entry.word || 'card').replace(/[^a-z0-9\-]+/gi, '_');
      zip.file(safeName + '.png', dataUrl, { base64: true });
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.download = 'word-pair-cards.zip';
    link.href = URL.createObjectURL(blob);
    link.click();

    btn.textContent = originalText;
    btn.disabled = false;
  });
</script>
</body>
</html>
